{{ ansible_managed | comment }}

# --- Pingvin Share file-drop vhost ({{ pingvin_domain }}) ---
#
# Tuning for large uploads (10GB+ video):
#   client_max_body_size {{ pingvin_max_body }}   -> 0 = no limit (default is 1m)
#   proxy_request_buffering off                   -> stream to backend, don't buffer to disk
#   long proxy/client timeouts                    -> a slow upload isn't cut off

server {
  listen 80;
  listen [::]:80;
  server_name {{ pingvin_domain }};

  # ACME HTTP-01 challenge webroot: certbot certonly --webroot -w /var/www/certbot
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

{% if pingvin_tls_enabled %}
  # Everything else -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name {{ pingvin_domain }};

  ssl_certificate     /etc/letsencrypt/live/{{ pingvin_domain }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ pingvin_domain }}/privkey.pem;

  client_max_body_size {{ pingvin_max_body }};
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_body_timeout 3600s;

  location / {
    proxy_pass http://{{ pingvin_upstream }};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }
}
{% else %}
  # No TLS cert yet -> serve Pingvin over plain HTTP for now.
  client_max_body_size {{ pingvin_max_body }};
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_body_timeout 3600s;

  location / {
    proxy_pass http://{{ pingvin_upstream }};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }
}
{% endif %}
